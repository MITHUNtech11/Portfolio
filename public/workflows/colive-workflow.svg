<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B20"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DB9558"/>
      <stop offset="100%" stop-color="#F5A663"/>
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#C72C48"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E5D3AF" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Top System Header Bar -->
  <g transform="translate(40, 45)">
    <rect width="720" height="42" rx="8" fill="#111C40" stroke="#E5D3AF" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#C72C48"/>
    <circle cx="40" cy="21" r="5" fill="#DB9558"/>
    <circle cx="56" cy="21" r="5" fill="#8B9A6E"/>
    <text x="80" y="26" fill="#F5EFE1" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">
      CO-LIVE PLATFORM // REAL-TIME DISTRIBUTED EXPENSE ENGINE
    </text>
    <rect x="620" y="10" width="85" height="22" rx="4" fill="#050B20" stroke="#DB9558" stroke-width="0.8"/>
    <text x="632" y="25" fill="#F5A663" font-family="monospace" font-size="10" font-weight="bold">FIREBASE</text>
  </g>

  <!-- Flow Lines / Data Bus -->
  <path d="M 190 230 L 255 230" stroke="#DB9558" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.8"/>
  <polygon points="255,226 263,230 255,234" fill="#DB9558"/>

  <path d="M 385 230 L 450 230" stroke="#DB9558" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.8"/>
  <polygon points="450,226 458,230 450,234" fill="#DB9558"/>

  <path d="M 580 230 L 645 230" stroke="#DB9558" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.8"/>
  <polygon points="645,226 653,230 645,234" fill="#DB9558"/>

  <!-- Module 1: Auth & Roles -->
  <g transform="translate(60, 150)">
    <rect width="130" height="160" rx="12" fill="#111C40" stroke="#E5D3AF" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="url(#burgundyGrad)"/>
    <text x="33" y="38" fill="#FFF" font-family="sans-serif" font-size="18" text-anchor="middle">👤</text>
    <text x="15" y="75" fill="#F5EFE1" font-family="sans-serif" font-size="13" font-weight="bold">Multi-Role Auth</text>
    <text x="15" y="95" fill="#A2B784" font-family="monospace" font-size="10">Firebase Auth</text>
    <text x="15" y="115" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Tenant Portal</text>
    <text x="15" y="130" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Landlord Control</text>
    <text x="15" y="145" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• House Onboarding</text>
  </g>

  <!-- Module 2: Cloud Firestore Sync -->
  <g transform="translate(255, 150)">
    <rect width="130" height="160" rx="12" fill="#111C40" stroke="#DB9558" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="url(#goldGrad)"/>
    <text x="33" y="38" fill="#010736" font-family="sans-serif" font-size="18" text-anchor="middle">⚡</text>
    <text x="15" y="75" fill="#F5EFE1" font-family="sans-serif" font-size="13" font-weight="bold">Cloud Firestore</text>
    <text x="15" y="95" fill="#DB9558" font-family="monospace" font-size="10">Reactive Stream</text>
    <text x="15" y="115" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Expense Ledger</text>
    <text x="15" y="130" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Chore Schedules</text>
    <text x="15" y="145" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Shared Grocery List</text>
  </g>

  <!-- Module 3: UPI Settlement Engine -->
  <g transform="translate(450, 150)">
    <rect width="130" height="160" rx="12" fill="#111C40" stroke="#E5D3AF" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#8B9A6E"/>
    <text x="33" y="38" fill="#FFF" font-family="sans-serif" font-size="18" text-anchor="middle">💳</text>
    <text x="15" y="75" fill="#F5EFE1" font-family="sans-serif" font-size="13" font-weight="bold">UPI Settlement</text>
    <text x="15" y="95" fill="#A2B784" font-family="monospace" font-size="10">Deep Linking</text>
    <text x="15" y="115" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• GPay / PhonePe</text>
    <text x="15" y="130" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Instant Split Pay</text>
    <text x="15" y="145" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Audit Receipts</text>
  </g>

  <!-- Module 4: PDF Financial Reporting -->
  <g transform="translate(645, 150)">
    <rect width="105" height="160" rx="12" fill="#111C40" stroke="#E5D3AF" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="url(#burgundyGrad)"/>
    <text x="33" y="38" fill="#FFF" font-family="sans-serif" font-size="18" text-anchor="middle">📄</text>
    <text x="15" y="75" fill="#F5EFE1" font-family="sans-serif" font-size="13" font-weight="bold">Audit &amp; PDF</text>
    <text x="15" y="95" fill="#F5A663" font-family="monospace" font-size="10">Client Export</text>
    <text x="15" y="115" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Monthly Reports</text>
    <text x="15" y="130" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Landlord Notices</text>
    <text x="15" y="145" fill="#C5CEE0" font-family="sans-serif" font-size="10" opacity="0.85">• Expense Logs</text>
  </g>

  <!-- Bottom Metric Badges -->
  <g transform="translate(40, 360)">
    <rect width="720" height="90" rx="10" fill="#050B20" stroke="#E5D3AF" stroke-opacity="0.2" stroke-width="1"/>
    
    <g transform="translate(30, 20)">
      <text x="0" y="24" fill="#DB9558" font-family="monospace" font-size="22" font-weight="bold">Real-Time</text>
      <text x="0" y="44" fill="#C5CEE0" font-family="sans-serif" font-size="11" opacity="0.8">Reactive Firestore Sync</text>
    </g>

    <line x1="200" y1="20" x2="200" y2="70" stroke="#E5D3AF" stroke-opacity="0.15"/>

    <g transform="translate(230, 20)">
      <text x="0" y="24" fill="#F5A663" font-family="monospace" font-size="22" font-weight="bold">Dual-Role</text>
      <text x="0" y="44" fill="#C5CEE0" font-family="sans-serif" font-size="11" opacity="0.8">Tenant &amp; Landlord Portals</text>
    </g>

    <line x1="390" y1="20" x2="390" y2="70" stroke="#E5D3AF" stroke-opacity="0.15"/>

    <g transform="translate(420, 20)">
      <text x="0" y="24" fill="#8B9A6E" font-family="monospace" font-size="22" font-weight="bold">1-Click</text>
      <text x="0" y="44" fill="#C5CEE0" font-family="sans-serif" font-size="11" opacity="0.8">Instant UPI Deep Linking</text>
    </g>

    <line x1="570" y1="20" x2="570" y2="70" stroke="#E5D3AF" stroke-opacity="0.15"/>

    <g transform="translate(600, 20)">
      <text x="0" y="24" fill="#C72C48" font-family="monospace" font-size="22" font-weight="bold">PDF Export</text>
      <text x="0" y="44" fill="#C5CEE0" font-family="sans-serif" font-size="11" opacity="0.8">Automated Expense Audits</text>
    </g>
  </g>
</svg>
